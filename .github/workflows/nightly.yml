name: Update Cyclops stockists

on:
  schedule:
    - cron: "17 14 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: stockists
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: cyclops-stockists
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch stockists
        env:
          SHEET_CSV_URL: ${{ secrets.SHEET_CSV_URL }}
          REQUEST_DELAY: "2.5"
          FAIL_ON_SOURCE_ERROR: "0"
        run: python3 job/fetch_stockists.py

      - name: Commit updated data
        run: |
          git config user.name "cyclops-stockist-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "Update stockists $(date -u +%Y-%m-%d)"
            git push
          fi
